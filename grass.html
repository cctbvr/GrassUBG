<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IXL | Math, Language Arts, Science, Social Studies, and Spanish</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link id="dynamic-favicon" rel="shortcut icon" href="https://www.ixl.com/ixl-favicon.png" type="image/x-icon">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap');
        
        :root {
            --accent: #4ade80; 
            --accent-glow: rgba(74, 222, 128, 0.4);
            --bg-dark: #050507;
            --sidebar-bg: rgba(15, 15, 20, 0.5);
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.15);
            --glass-blur: blur(30px);
            --card-transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body { 
            background-color: var(--bg-dark); 
            color: #ffffff; 
            overflow: hidden; 
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='22' height='22' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z'></path></svg>") 0 0, auto;
        }

        button, .card, .nav-btn, .color-circle, select, .setting-input, .ixl-btn, .proxy-link {
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%234ade80' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='9'></circle><circle cx='12' cy='12' r='2'></circle></svg>") 12 12, pointer !important;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        #bg-canvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 1;
        }

        /* =========================================
           PIXEL-PERFECT OFFICIAL IXL DESKTOP DISGUISE
           ========================================= */
        #cloak-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #ffffff; color: #333; z-index: 9999;
            font-family: 'PT Sans', Arial, sans-serif; overflow-y: auto;
        }
        
        /* Header */
        .ixl-header {
            background-color: #72bf26;
            display: flex; flex-direction: column;
        }
        .ixl-top {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 40px; height: 60px;
        }
        .ixl-logo {
            background: white; padding: 4px 10px; border-radius: 6px;
            font-size: 1.8rem; font-weight: 900; letter-spacing: -1px;
            display: flex; align-items: center; user-select: none;
        }
        .ixl-logo span:nth-child(1) { color: #0077b3; }
        .ixl-logo span:nth-child(2) { color: #f59e0b; }
        .ixl-logo span:nth-child(3) { color: #10b981; }

        .ixl-search-bar {
            background: white; border-radius: 20px; padding: 6px 15px;
            display: flex; align-items: center; width: 500px;
        }
        .ixl-search-bar i { color: #999; margin-right: 10px; font-size: 0.9rem; }
        .ixl-search-bar input {
            border: none; outline: none; width: 100%; font-size: 0.95rem; font-family: 'PT Sans', sans-serif;
            color: #333;
        }
        
        .ixl-auth-buttons { display: flex; gap: 15px; }
        .ixl-btn {
            border: none; padding: 6px 16px; border-radius: 4px; font-weight: 700;
            font-size: 0.9rem; font-family: 'PT Sans', sans-serif;
        }
        .ixl-btn-signin { background-color: #007cc2; color: white; display: flex; align-items: center; gap: 8px; }
        .ixl-btn-membership { background-color: #d1f0a1; color: #2d5a00; }

        /* Sub Nav */
        .ixl-subnav {
            background-color: #65b017; padding: 8px 0;
            display: flex; justify-content: center; gap: 40px;
        }
        .ixl-subnav a {
            color: white; text-decoration: none; font-size: 1.1rem;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        /* Hero Section */
        .ixl-hero {
            background: linear-gradient(to bottom, #dff6f0 0%, #c1edd8 50%, #a6e6c3 100%);
            padding: 40px 20px 80px; text-align: center; position: relative;
            overflow: hidden; border-bottom: 5px solid #6cb821;
        }
        .ixl-hero h1 {
            font-size: 2.8rem; font-weight: 400; color: #333; margin-bottom: 30px;
        }
        .ixl-hero h1 span { color: #007cc2; font-weight: 700; }

        /* Clouds */
        .ixl-clouds {
            display: flex; justify-content: center; gap: 10px; margin-bottom: 40px;
            position: relative; z-index: 2;
        }
        .ixl-cloud {
            background: white; border-radius: 50%; width: 280px; height: 160px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05); padding: 20px;
            position: relative;
        }
        .ixl-cloud:nth-child(2) { width: 320px; height: 180px; transform: translateY(-10px); box-shadow: 0 12px 30px rgba(0,0,0,0.08); z-index: 3; }
        
        .ixl-cloud h3 { font-size: 1.2rem; margin-bottom: 10px; font-weight: 400; }
        .ixl-cloud p { font-size: 0.85rem; color: #555; text-align: center; line-height: 1.4; }
        .ixl-cloud.blue h3 { color: #007cc2; }
        .ixl-cloud.purple h3 { color: #8a4baf; }
        .ixl-cloud.teal h3 { color: #00a4b4; }
        .ixl-cloud i { position: absolute; bottom: -15px; background: white; border-radius: 50%; padding: 4px; color: #999; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        .ixl-join-hero {
            background-color: #6fb523; color: white; border: none;
            padding: 14px 40px; font-size: 1.2rem; font-weight: 700;
            border-radius: 4px; box-shadow: 0 4px 10px rgba(111, 181, 35, 0.4);
            position: relative; z-index: 5;
        }

        /* Content Area */
        .ixl-content {
            max-width: 1000px; margin: 40px auto; padding: 0 20px;
        }
        .ixl-promo-banners {
            display: flex; gap: 20px; margin-bottom: 40px;
        }
        .ixl-promo {
            background: #e6f9e6; border: 1px solid #c3e8c3; border-radius: 40px;
            flex: 1; padding: 20px 30px; display: flex; align-items: center; gap: 20px;
        }
        .ixl-promo img { width: 60px; height: 60px; }
        .ixl-promo h4 { color: #2d5a00; font-size: 1.2rem; margin-bottom: 5px; }
        .ixl-promo p { color: #555; font-size: 0.9rem; }
        .ixl-promo a { color: #6fb523; font-weight: bold; text-decoration: none; font-size: 0.9rem; }

        .ixl-grades {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
        }
        .ixl-grade-card {
            border: 1px solid #e0e0e0; border-radius: 4px; padding: 20px;
            background: white; border-top: 4px solid #ccc;
        }
        .ixl-grade-card:nth-child(1) { border-top-color: #00a4b4; }
        .ixl-grade-card:nth-child(2) { border-top-color: #f59e0b; }
        .ixl-grade-card:nth-child(3) { border-top-color: #6fb523; }
        
        .ixl-grade-header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .ixl-grade-icon {
            width: 30px; height: 30px; border-radius: 50%; color: white;
            display: flex; align-items: center; justify-content: center; font-weight: bold;
        }
        .ixl-grade-card:nth-child(1) .ixl-grade-icon { background: #00a4b4; }
        .ixl-grade-card:nth-child(2) .ixl-grade-icon { background: #f59e0b; }
        .ixl-grade-card:nth-child(3) .ixl-grade-icon { background: #6fb523; }
        
        .ixl-grade-card h2 { font-size: 1.4rem; color: #333; font-weight: 400; }
        .ixl-grade-card p { font-size: 0.9rem; color: #666; line-height: 1.5; margin-bottom: 20px; }
        .ixl-stats { display: flex; justify-content: space-between; font-size: 0.85rem; color: #007cc2; border-top: 1px solid #eee; padding-top: 10px;}

        /* =========================================
           10X UI - FULLSCREEN ONBOARDING
           ========================================= */
        #onboarding-screen {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 5, 7, 0.9); backdrop-filter: blur(40px);
            z-index: 10000; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .onboarding-container {
            width: 100%; max-width: 600px; height: 400px; position: relative;
            display: flex; align-items: center; justify-content: center;
        }
        .onboard-step {
            position: absolute; width: 100%; text-align: center;
            opacity: 0; transform: translateY(30px) scale(0.95); pointer-events: none;
            transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .onboard-step.active {
            opacity: 1; transform: translateY(0) scale(1); pointer-events: all;
        }
        .onboard-step h1 { font-size: 3.5rem; font-weight: 900; margin-bottom: 10px; letter-spacing: -1px; text-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .onboard-step p { font-size: 1.2rem; color: #94a3b8; margin-bottom: 40px; }
        
        .onboard-btn {
            background: var(--accent); color: #050507; border: none;
            padding: 16px 40px; font-size: 1.2rem; font-weight: 800; border-radius: 30px;
            box-shadow: 0 10px 30px var(--accent-glow); transition: all 0.3s;
        }
        .onboard-btn:hover { transform: translateY(-3px) scale(1.05); filter: brightness(1.2); }
        
        .theme-selector { display: flex; gap: 20px; justify-content: center; margin-bottom: 40px; }
        .theme-selector .color-circle { width: 60px; height: 60px; }

        .cloak-selector-wrap { max-width: 400px; margin: 0 auto 40px; }
        .cloak-selector-wrap select {
            width: 100%; padding: 20px; background: rgba(255,255,255,0.05);
            border: 2px solid var(--glass-border); color: white; border-radius: 16px;
            font-size: 1.1rem; font-weight: 600; outline: none; appearance: none;
            text-align: center; transition: all 0.3s;
        }
        .cloak-selector-wrap select:focus { border-color: var(--accent); background: rgba(255,255,255,0.1); box-shadow: 0 0 30px var(--accent-glow); }

        /* =========================================
           MAIN APP UI - 10X UPGRADE
           ========================================= */
        #main-app {
            display: none; 
            width: 100vw; 
            height: 100vh; 
            background: transparent; 
            position: relative; 
            overflow: hidden; 
            z-index: 2;
        }
        
        /* Subtle UI Grain */
        #main-app::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            pointer-events: none; z-index: 1; opacity: 0.6;
        }

        .sidebar {
            width: 280px; background: var(--sidebar-bg); backdrop-filter: var(--glass-blur);
            border-right: 1px solid var(--glass-border); display: flex; flex-direction: column; 
            padding: 40px 25px; z-index: 10; position: relative;
        }
        .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 50px; padding-left: 10px; }
        .grass-logo { width: 42px; height: 42px; filter: drop-shadow(0 0 20px var(--accent-glow)); }
        .grass-logo path { fill: var(--accent); }
        .brand-text { font-size: 2rem; font-weight: 900; color: white; letter-spacing: 3px; text-transform: uppercase; }

        .nav-btn {
            background: transparent; border: 1px solid transparent; color: #64748b; padding: 18px 20px; margin-bottom: 10px;
            text-align: left; font-size: 1.1rem; font-weight: 600; border-radius: 16px;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); display: flex; align-items: center; gap: 18px;
            position: relative; overflow: hidden;
        }
        .nav-btn i { width: 24px; text-align: center; font-size: 1.2rem; z-index: 2; transition: all 0.3s; }
        .nav-btn span { z-index: 2; }
        .nav-btn::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, var(--accent-glow), transparent);
            opacity: 0; transition: opacity 0.4s; z-index: 1;
        }
        .nav-btn:hover { color: #ffffff; transform: translateX(8px); background: rgba(255,255,255,0.03); border-color: rgba(255,255,255,0.05); }
        .nav-btn:hover i { color: var(--accent); transform: scale(1.1); }
        .nav-btn.active { 
            color: #ffffff; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); 
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); 
        }
        .nav-btn.active::before { opacity: 1; border-left: 4px solid var(--accent); }
        .nav-btn.active i { color: var(--accent); text-shadow: 0 0 15px var(--accent-glow); }

        .content-area { flex-grow: 1; padding: 50px 70px; overflow-y: auto; position: relative; height: 100vh; z-index: 5; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeSlideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

        .section-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 50px; }
        .page-title { font-size: 3.5rem; font-weight: 900; letter-spacing: -2px; margin: 0; color: white; }
        
        .tab-search { position: relative; width: 360px; }
        .tab-search i { position: absolute; left: 22px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 1.1rem; }
        .tab-search input {
            width: 100%; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(20px);
            padding: 16px 20px 16px 54px; border-radius: 20px; color: white; font-size: 1.05rem; font-weight: 500; outline: none; transition: all 0.4s;
        }
        .tab-search input:focus { border-color: var(--accent); box-shadow: 0 0 30px var(--accent-glow); background: rgba(0,0,0,0.6); }

        /* GIANT GRASS LOGO HOMEPAGE */
        .home-center-wrap {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: calc(100% - 60px); text-align: center; position: relative;
        }
        .home-widgets {
            position: absolute; top: 0px; display: flex; gap: 40px;
            background: linear-gradient(180deg, rgba(30,30,40,0.4), rgba(15,15,20,0.6)); 
            backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.08); 
            padding: 20px 45px; border-radius: 40px; font-weight: 700; font-size: 1.2rem; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); color: white; z-index: 5;
        }
        .home-widgets div { display: flex; align-items: center; gap: 12px; }
        .home-widgets i { color: var(--accent); filter: drop-shadow(0 0 10px var(--accent-glow)); font-size: 1.4rem; }

        .giant-logo-container {
            position: relative; padding: 60px; display: flex; flex-direction: column; align-items: center;
            transition: transform 0.1s ease-out; user-select: none;
        }
        .giant-grass-svg {
            width: 320px; height: 320px; filter: drop-shadow(0 0 80px var(--accent-glow));
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .giant-grass-svg path { fill: var(--accent); }
        .giant-logo-container:hover .giant-grass-svg { transform: scale(1.05); }

        /* PROXY TAB STYLES (OVERCLOAKED REPLICA) */
        .proxy-container {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; margin-top: 30px;
        }
        .proxy-title {
            font-size: 5rem; font-weight: 900; color: white; margin-bottom: 40px;
            letter-spacing: 1px; text-shadow: 0 0 40px var(--accent-glow);
        }
        .proxy-search-wrapper {
            position: relative; width: 100%; max-width: 650px; margin-bottom: 40px;
        }
        .proxy-search-wrapper i {
            position: absolute; right: 25px; top: 50%; transform: translateY(-50%);
            color: #94a3b8; font-size: 1.3rem;
        }
        .proxy-search-wrapper input {
            width: 100%; background: rgba(20,20,25,0.7); border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(25px); padding: 22px 60px 22px 30px; border-radius: 18px;
            color: white; font-size: 1.15rem; outline: none; transition: all 0.3s;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); font-weight: 500;
        }
        .proxy-search-wrapper input:focus {
            border-color: var(--accent); box-shadow: 0 0 35px var(--accent-glow), 0 15px 35px rgba(0,0,0,0.4);
            background: rgba(15,15,20,0.9);
        }
        .proxy-quick-links { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .proxy-link {
            background: rgba(20,20,25,0.6); border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(20px); padding: 25px 35px; border-radius: 20px;
            color: white; font-weight: 600; font-size: 1rem; transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); min-width: 130px; text-align: center;
        }
        .proxy-link:hover {
            transform: translateY(-5px); border-color: var(--accent);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4), 0 0 25px var(--accent-glow); color: var(--accent);
        }

        /* 10X CARDS */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 35px; }
        .card {
            background: rgba(20, 20, 25, 0.6);
            backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 24px; display: flex; flex-direction: column; transition: var(--card-transition);
            overflow: hidden; height: 280px; box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            position: relative; opacity: 0; animation: scaleUp 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            text-decoration: none;
        }
        
        .card:nth-child(1) { animation-delay: 0.05s; }
        .card:nth-child(2) { animation-delay: 0.1s; }
        .card:nth-child(3) { animation-delay: 0.15s; }
        .card:nth-child(4) { animation-delay: 0.2s; }
        .card:nth-child(5) { animation-delay: 0.25s; }
        .card:nth-child(6) { animation-delay: 0.3s; }
        .card:nth-child(7) { animation-delay: 0.35s; }
        .card:nth-child(8) { animation-delay: 0.4s; }
        .card:nth-child(9) { animation-delay: 0.45s; }
        .card:nth-child(10) { animation-delay: 0.5s; }

        .card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            z-index: 10; opacity: 0.3; transition: opacity 0.4s;
        }
        
        .card:hover { 
            transform: translateY(-12px) scale(1.03); 
            border-color: var(--accent); 
            box-shadow: 0 25px 50px rgba(0,0,0,0.6), 0 0 40px var(--accent-glow); 
        }
        .card:hover::before { opacity: 0.8; background: linear-gradient(90deg, transparent, var(--accent), transparent); }
        
        /* CARD IMG WITHOUT FAKE THUMBNAILS */
        .card-img { 
            height: 180px; width: 100%; 
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
            position: relative; transition: all 0.5s ease;
            display: flex; align-items: center; justify-content: center;
        }
        .card:hover .card-img { transform: scale(1.08); background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%); }
        
        .card-img::after {
            content: '\f11b'; /* FontAwesome Gamepad Default */
            font-family: 'Font Awesome 6 Free'; font-weight: 900;
            font-size: 4rem; color: rgba(255,255,255,0.05); z-index: 0; position: absolute;
            transition: all 0.5s ease;
        }
        .card:hover .card-img::after { color: var(--accent); opacity: 0.3; transform: scale(1.1); filter: drop-shadow(0 0 20px var(--accent-glow)); }
        
        #movies-grid .card-img::after { content: '\f03d'; } /* Video Icon */
        #apps-grid .card-img::after { content: '\f3cd'; } /* Mobile Icon */

        .card-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to top, rgba(15,15,20,1) 0%, rgba(15,15,20,0) 100%);
            z-index: 1; pointer-events: none; transition: opacity 0.4s;
        }

        .card-play-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
            width: 60px; height: 60px; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px);
            border: 2px solid var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: var(--accent); font-size: 1.5rem; opacity: 0; transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 2; padding-left: 4px;
        }
        .card:hover .card-play-btn { opacity: 1; transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 30px var(--accent-glow); }
        
        .card-info { 
            padding: 20px 25px; display: flex; flex-direction: column; background: rgba(15,15,20,0.9);
